[book]
title = "stash User Manual"
description = "Encrypted command-line manager for notes, URLs, and secrets."
authors = ["Leif Jantzen"]
language = "en"
src = "src"

[output.html]
default-theme = "light"
git-repository-url = "https://github.com/ljantzen/secretstash"
